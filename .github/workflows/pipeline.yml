name: MLOps pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.bootstrap_data
      - run: dvc pull -r local
      - run: pytest tests/ -v
  train:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.bootstrap_data
      - run: dvc pull -r local
      - run: python -m src.train --config configs/best.yaml --final
      - uses: actions/upload-artifact@v4
        with:
          name: trained-model-and-tracking
          path: |
            artifacts/
            mlruns/
            mlflow.db
